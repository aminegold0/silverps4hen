<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>PS4 Host</title>


    <style>
        :root {
            --background: #0b0d10;
            --panel: #11151b;
            --line: #1e2732;
            --text: #c8ced8;
            --bright: #e6ebf2;
            --muted: #75808d;
            --green: #7fd0a0;
            --red: #d08a7f;
            --yellow: #d8c07f;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            background: var(--background);
            color: var(--text);

            font:
                15px/1.45
                "Segoe UI",
                system-ui,
                sans-serif;
        }

        button {
            font: inherit;
        }

        [hidden] {
            display: none !important;
        }


        /* BACKGROUND VIDEO */

        .bg-video {
            position: fixed;
            inset: 0;
            z-index: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 0.16;

            filter:
                brightness(0.45)
                blur(1px);

            pointer-events: none;
        }


        /* HEADER */

        #brand {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            padding: 9px 10px;

            background: rgba(14, 17, 22, 0.92);

            border-bottom:
                1px solid var(--line);

            text-align: center;
        }

        #brandIcon {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--green);

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #24372c,
                    #10151a 70%
                );

            border:
                1px solid #355445;

            border-radius: 50%;

            font-size: 10px;
            font-weight: 800;
        }

        #brand b {
            color: var(--bright);

            font-size: 15px;
            font-weight: 700;

            letter-spacing: 0.14em;

            vertical-align: middle;
        }


        /* START SCREEN */

        #startArea {
            position: fixed;

            top: 50%;
            left: 50%;
            z-index: 1;

            transform:
                translate(-50%, -50%);

            text-align: center;
        }

        #startButton {
            min-width: 220px;
            min-height: 68px;

            padding: 0 36px;

            color: #dfffee;

            background:
                linear-gradient(
                    180deg,
                    #16221b,
                    #0c100e
                );

            border:
                1px solid #4d9f73;

            border-radius: 6px;

            box-shadow:
                0 0 26px
                rgba(127, 208, 160, 0.12);

            font-size: 18px;
            font-weight: 800;

            letter-spacing: 3px;

            cursor: pointer;
        }

        #startButton:hover {
            border-color: var(--green);

            box-shadow:
                0 0 32px
                rgba(127, 208, 160, 0.22);
        }

        #startButton:active {
            transform: translateY(1px);
        }

        #startButton:disabled {
            opacity: 0.45;
            cursor: default;
        }

        #startHint {
            margin-top: 12px;

            color: var(--muted);

            font-size: 11px;

            letter-spacing: 1px;

            text-shadow:
                0 1px 3px #000;
        }


        /* UNSUPPORTED WARNING */

        #unsupported {
            position: fixed;

            top: 50%;
            left: 50%;
            z-index: 10;

            width: min(430px, 90%);

            padding: 23px 22px;

            background:
                linear-gradient(
                    180deg,
                    #16181d,
                    var(--panel)
                );

            border:
                1px solid #4b3835;

            border-radius: 6px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.45);

            text-align: center;

            transform:
                translate(-50%, -50%);
        }

        #unsupported h1 {
            margin: 0;

            color: var(--red);

            font-size: 21px;
            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        #unsupported p {
            margin: 14px 0;

            color: #9aa4b1;

            font-size: 13px;
            line-height: 1.6;
        }

        #unsupportedCode {
            display: block;

            max-height: 80px;
            overflow: auto;

            margin: 0 0 17px;
            padding: 8px;

            color: #9fb3d0;

            background: #0b0e12;

            border:
                1px solid var(--line);

            border-radius: 4px;

            font-family:
                Consolas,
                monospace;

            font-size: 10px;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        #ignoreButton {
            min-width: 160px;
            min-height: 46px;

            padding: 0 22px;

            color: #ffe6e2;

            background:
                linear-gradient(
                    180deg,
                    #2a1917,
                    #160f0e
                );

            border:
                1px solid #8a4e46;

            border-radius: 5px;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2px;

            cursor: pointer;
        }

        #ignoreButton:hover {
            border-color: var(--red);

            box-shadow:
                0 0 22px
                rgba(208, 138, 127, 0.16);
        }


        /* SPINNER */

        #spin {
            position: fixed;

            top: calc(50% + 18px);
            left: 50%;
            z-index: 4;

            width: 46px;
            height: 46px;

            margin:
                -23px 0 0 -23px;

            border:
                4px solid var(--line);

            border-top-color: var(--green);

            border-radius: 50%;

            animation:
                spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }


        /* RESULT */

        #msg {
            position: fixed;

            top: 50%;
            left: 0;
            right: 0;
            z-index: 5;

            transform:
                translateY(-50%);

            display: none;

            padding: 0 20px;

            text-align: center;

            font-size: 18px;
            font-weight: 800;

            letter-spacing: 2px;

            text-shadow:
                0 2px 4px #000;
        }

        #spin,
        #msg,
        #wrap {
            display: none;
        }


        body.loading #startArea,
        body.loading #unsupported {
            display: none;
        }

        body.loading #spin {
            display: block;
        }

        body.done #startArea,
        body.done #unsupported,
        body.fail #startArea,
        body.fail #unsupported {
            display: none;
        }

        body.done #spin,
        body.fail #spin {
            display: none;
        }

        body.done #msg {
            display: block;
            color: var(--green);
        }

        body.fail #msg {
            display: block;
            color: var(--red);
        }

        body.log #spin,
        body.log #msg {
            display: none;
        }

        body.log #wrap {
            display: block;

            padding: 14px 18px;
        }

        body.log #state {
            margin: 0 0 8px;

            font-size: 22px;
            font-weight: 700;
        }

        body.log #out {
            display: block;

            height: calc(100vh - 141px);
            overflow-y: auto;

            padding: 10px 12px;

            background: var(--panel);

            border:
                1px solid var(--line);

            border-radius: 5px;

            font:
                12px/1.45
                Consolas,
                monospace;

            white-space: pre-wrap;
        }

        .ok,
        .safe {
            color: var(--green);
        }

        .bad,
        .danger {
            color: var(--red);
        }

        .warn {
            color: var(--yellow);
        }

        code {
            color: #9fb3d0;
        }
    </style>
</head>

<body>

    <!-- BACKGROUND VIDEO -->
    <video
        id="bgVideo"
        class="bg-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >
        <source
            src="background.mp4"
            type="video/mp4"
        >
    </video>


    <!-- BACKGROUND MUSIC -->
    <audio
        id="bgAudio"
        src="background.mp3"
        loop
        preload="auto"
    ></audio>


    <div id="brand">
        <div id="brandIcon">
            PS
        </div>

        <b> exploit from ASaudidos</b>
    </div>


    <!-- START SCREEN -->
    <div id="startArea">
        <button
            id="startButton"
            type="button"
        >
            START
        </button>

        <div id="startHint">
            Press X or tap START
        </div>
    </div>


    <!-- UNSUPPORTED SCREEN -->
    <section
        id="unsupported"
        hidden
    >
        <h1>
            Unsupported Device
        </h1>

        <p>
            This browser does not appear to be a
            PlayStation 4 browser.
        </p>

        <code
            id="unsupportedCode"
        ></code>

        <button
            id="ignoreButton"
            type="button"
        >
            IGNORE
        </button>
    </section>


    <!-- LOADING -->
    <div id="spin"></div>


    <!-- DONE / RESTART -->
    <div id="msg"></div>


    <!-- Compatibility output for real jb.js -->
    <div id="wrap">
        <div id="state"></div>
        <div id="out"></div>
    </div>


    <script type="module">
        const bgVideo =
            document.getElementById("bgVideo");

        const bgAudio =
            document.getElementById("bgAudio");

        const startArea =
            document.getElementById("startArea");

        const startButton =
            document.getElementById("startButton");

        const unsupported =
            document.getElementById("unsupported");

        const unsupportedCode =
            document.getElementById("unsupportedCode");

        const ignoreButton =
            document.getElementById("ignoreButton");

        const message =
            document.getElementById("msg");


        const userAgent =
            navigator.userAgent || "";

        const isPS4 =
            /PlayStation 4|PS4/i.test(
                userAgent
            );


        const WATCHDOG_MS =
            120000;


        let startPressed = false;
        let jbStarted = false;
        let finished = false;
        let watchdog = 0;
        let musicStarted = false;


        startButton.addEventListener(
            "click",
            onStart
        );


        startButton.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    onStart();
                }

            }
        );


        ignoreButton.addEventListener(
            "click",
            function () {

                unsupported.hidden = true;

                beginJb();

            }
        );


        function onStart() {

            if (startPressed) {
                return;
            }


            startPressed = true;

            startButton.disabled = true;


            if (!isPS4) {

                startArea.hidden = true;

                unsupportedCode.textContent =
                    userAgent || "Unknown browser";

                unsupported.hidden = false;

                return;

            }


            beginJb();

        }


        function beginJb() {

            if (jbStarted) {
                return;
            }


            jbStarted = true;

            startArea.hidden = true;
            unsupported.hidden = true;


            enableBackgroundAudio();


            document.body.classList.add(
                "loading"
            );


            startWatchdog();


            import("./jb.js?v=19")
                .catch(function (error) {

                    console.error(error);

                    finish(
                        "fail",
                        "Restart your console"
                    );

                });

        }


        function enableBackgroundAudio() {

            if (!bgAudio || musicStarted) {
                return;
            }


            try {

                bgAudio.loop = true;
                bgAudio.muted = false;
                bgAudio.volume = 0.40;


                const playPromise =
                    bgAudio.play();


                if (
                    playPromise &&
                    typeof playPromise.then === "function"
                ) {

                    playPromise
                        .then(function () {

                            musicStarted = true;

                            console.log(
                                "Background music started."
                            );

                        })
                        .catch(function (error) {

                            console.warn(
                                "Music autoplay blocked:",
                                error
                            );

                            queueAudioUnlock();

                        });

                } else {

                    /*
                     * Older browser without Promise support.
                     */

                    musicStarted = true;

                }

            } catch (error) {

                console.warn(
                    "Could not start background music:",
                    error
                );

                queueAudioUnlock();

            }

        }


        function queueAudioUnlock() {

            function unlockAudio() {
                enableBackgroundAudio();
            }


            window.addEventListener(
                "pointerdown",
                unlockAudio,
                {
                    once: true,
                    passive: true,
                    capture: true
                }
            );


            window.addEventListener(
                "keydown",
                unlockAudio,
                {
                    once: true,
                    capture: true
                }
            );


            window.addEventListener(
                "touchstart",
                unlockAudio,
                {
                    once: true,
                    passive: true,
                    capture: true
                }
            );

        }


        /*
         * Prepare music unlock before the user presses START.
         */

        queueAudioUnlock();


        /*
         * The real jb.js should add "done"
         * or "fail" to document.body.classList.
         */

        const resultObserver =
            new MutationObserver(function () {

                if (
                    document.body.classList.contains(
                        "done"
                    )
                ) {
                    finish(
                        "done",
                        "DONE"
                    );

                    return;
                }


                if (
                    document.body.classList.contains(
                        "fail"
                    )
                ) {
                    finish(
                        "fail",
                        "Restart your console"
                    );

                    return;
                }

            });


        resultObserver.observe(
            document.body,
            {
                attributes: true,
                attributeFilter: ["class"]
            }
        );


        function startWatchdog() {

            clearTimeout(watchdog);


            watchdog =
                setTimeout(function () {

                    if (finished) {
                        return;
                    }


                    finish(
                        "fail",
                        "Restart your console"
                    );

                }, WATCHDOG_MS);

        }


        function finish(type, text) {

            if (finished) {
                return;
            }


            finished = true;


            clearTimeout(watchdog);


            document.body.classList.remove(
                "loading",
                "done",
                "fail"
            );


            document.body.classList.add(
                type
            );


            startArea.hidden = true;
            unsupported.hidden = true;

            message.textContent =
                text;

        }


        try {
            startButton.focus();
        } catch (error) {
            /*
             * Focus is optional.
             */
        }

    </script>

</body>
</html>
